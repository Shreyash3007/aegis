# CI for the aegis CLI itself (ci-templates/ are for TARGET repos, not this one).
name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The suite is developed on Windows and must stay green on the
        # identity-less ubuntu runners too (v0.6-0.8 shipped red unnoticed:
        # the release ritual now requires green on BOTH platforms).
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: smoke
        run: node dist/cli.js help
      - name: adversarial audit (148+ checks, 0 findings required)
        run: node scripts/audit.mjs
